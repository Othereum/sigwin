[package]
name = "sigwin-thumb"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "Pixel work for sigwin (decode, resample), kept out of the main crate so it is optimized in every profile"

[dependencies]
# 6.2 fixes an out-of-bounds read when enlarging from a crop
fast_image_resize = "6.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
slint = { version = "1.19.0", default-features = false, features = ["std", "compat-1-2"] }
# APNG encoder for animated stickers (same version the image crate uses)
png = "0.18.1"
# AVIF: `image` decodes it only through the dav1d C library (see src/avif.rs)
rav1d = { version = "1.1.0", default-features = false, features = ["bitdepth_8", "bitdepth_16", "asm"] }
mp4parse = "0.17.0"
# rav1d reports EAGAIN with the platform's value
libc = "0.2.191"
