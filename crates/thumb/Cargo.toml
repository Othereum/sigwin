[package]
name = "sigwin-thumb"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "Pixel work for sigwin (decode, resample), kept out of the main crate so it is optimized in every profile"

[dependencies]
# 6.2 fixes an out-of-bounds read when enlarging from a crop
fast_image_resize = "6.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
# decodes a JPEG at 1/2, 1/4 or 1/8 of its size, which `image`'s decoder can't: a thumbnail
# made from a photo needn't hold all of it decoded. No rayon: thumbnails are made one at a time
jpeg-decoder = { version = "0.3.2", default-features = false }
slint = { version = "1.19.1", default-features = false, features = ["std", "compat-1-2"] }
# `image`'s JPEG decoder, used directly to decode into RGBA for the viewer (same versions)
zune-jpeg = "0.5.15"
zune-core = "0.5.3"
# counts a GIF's frames without decoding them (same version the image crate uses)
gif = { version = "0.14.2", default-features = false, features = ["std"] }
# APNG encoder for animated stickers (same version the image crate uses)
png = "0.18.1"
# AVIF: `image` decodes it only through the dav1d C library (see src/avif.rs)
rav1d = { version = "1.1.0", default-features = false, features = ["bitdepth_8", "bitdepth_16", "asm"] }
mp4parse = "0.17.0"
# rav1d reports EAGAIN with the platform's value
libc = "0.2.191"
