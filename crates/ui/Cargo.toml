[package]
name = "sigwin-ui"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "Slint-generated UI code for sigwin (ui/*.slint), kept out of the main crate so Rust-only edits don't recompile it"

[dependencies]
# features come from the main crate (unified)
slint = { version = "1.18.1", default-features = false, features = ["std", "compat-1-2"] }

[build-dependencies]
slint-build = "1.18.1"
