[package]
name = "sigwin-vault"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "Encrypted cache files for sigwin (attachments, thumbnails), kept out of the main crate so the cipher is optimized in every profile"

[dependencies]
# same versions libsignal already pulls in: no new crates in the tree
aes-gcm = { version = "0.11", default-features = false, features = ["aes"] }
hkdf = "0.13"
sha2 = "0.11"
getrandom = "0.3"
