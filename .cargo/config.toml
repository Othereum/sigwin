[env]
# sqlcipher uses the pure-Rust crypto provider (bundled-sqlcipher-custom-crypto);
# the Windows build script still insists on OpenSSL paths, so point it at empty dirs.
OPENSSL_LIB_DIR = { value = "build-support/no-openssl/lib", relative = true }
OPENSSL_INCLUDE_DIR = { value = "build-support/no-openssl/include", relative = true }
# default LLVM install dir (winget LLVM.LLVM); protoc is found on PATH (winget Google.Protobuf),
# or set PROTOC / LIBCLANG_PATH in the environment to override.
LIBCLANG_PATH = { value = 'C:/Program Files/LLVM/bin', force = false }
