# Push a tag matching Cargo.toml's version (e.g. v0.2.0) to publish a release.
# Installed apps pick it up within hours: they download sigwin.exe and check
# sigwin.exe.minisig against the public key built into the app (src/update.rs).
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Check the tag matches Cargo.toml
        shell: pwsh
        run: |
          $v = ((cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages | Where-Object name -eq sigwin).version
          if ("v$v" -ne "${{ github.ref_name }}") { throw "tag ${{ github.ref_name }} does not match Cargo.toml $v" }
          "VERSION=$v" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      # LLVM and CMake come with the runner image
      - name: Install protoc and NASM
        shell: pwsh
        run: |
          choco install protoc nasm -y --no-progress
          "C:\Program Files\NASM" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Build
        run: cargo build --release --locked

      - name: Sign
        shell: pwsh
        env:
          MINISIGN_KEY: ${{ secrets.MINISIGN_KEY }}
        run: |
          if (-not $env:MINISIGN_KEY) { throw "MINISIGN_KEY secret is not set" }
          Invoke-WebRequest https://github.com/jedisct1/minisign/releases/download/0.12/minisign-0.12-win64.zip -OutFile minisign.zip
          $hash = (Get-FileHash minisign.zip -Algorithm SHA256).Hash
          if ($hash -ne "37B600344E20C19314B2E82813DB2BFDCC408B77B876F7727889DBD46D539479") { throw "minisign.zip checksum $hash" }
          Expand-Archive minisign.zip -DestinationPath minisign
          $key = Join-Path $env:RUNNER_TEMP "sigwin.key"
          $env:MINISIGN_KEY | Out-File -Encoding ascii $key
          Copy-Item target\release\sigwin.exe sigwin.exe
          # the app accepts only this exact trusted comment for this version
          .\minisign\minisign-win64\x86_64\minisign.exe -S -s $key -m sigwin.exe -t "sigwin $env:VERSION"
          $code = $LASTEXITCODE
          Remove-Item $key
          if ($code -ne 0) { throw "minisign failed" }

      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" sigwin.exe sigwin.exe.minisig --title "Sigwin $env:VERSION" --generate-notes
