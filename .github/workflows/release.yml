# Run from main (Actions > release > Run workflow, or `gh workflow run release.yml`)
# after bumping Cargo.toml's version: builds, signs, then creates tag v<version> and the release.
# Installed apps pick it up within hours: they download sigwin.exe and check
# sigwin.exe.minisig against the public key built into the app (src/update.rs).
name: release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # runs on main, so it shares main's cache with ci.yml
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release

      - name: Read the version and check the tag is new
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ("${{ github.ref }}" -ne "refs/heads/main") { throw "run this workflow on main" }
          $v = ((cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages | Where-Object name -eq sigwin).version
          gh release view "v$v" *> $null
          if ($LASTEXITCODE -eq 0) { throw "release v$v already exists: bump the version" }
          "VERSION=$v" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          # gh exits 1 when the release is absent (expected): don't let pwsh report it
          exit 0

      # LLVM and CMake come with the runner image
      - name: Install protoc and NASM
        shell: pwsh
        run: |
          choco install protoc nasm -y --no-progress
          "C:\Program Files\NASM" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      # third-party notices, embedded in the exe (settings > 정보) and published beside it
      - name: Generate license notices
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/EmbarkStudios/cargo-about/releases/download/0.9.3/cargo-about-0.9.3-x86_64-pc-windows-msvc.tar.gz -OutFile cargo-about.tar.gz
          $hash = (Get-FileHash cargo-about.tar.gz -Algorithm SHA256).Hash
          if ($hash -ne "9E2942533EF1C592C4A70BDB384CAE1550A3F5FC9AE40379B6662E3D2F16FE02") { throw "cargo-about.tar.gz checksum $hash" }
          tar -xzf cargo-about.tar.gz
          .\cargo-about-0.9.3-x86_64-pc-windows-msvc\cargo-about.exe generate -c build-support/about.toml build-support/about.hbs -o licenses.html
          if ($LASTEXITCODE -ne 0) { throw "cargo about failed" }
          "SIGWIN_LICENSES=$PWD\licenses.html" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Build
        run: cargo build --release --locked

      - name: Sign
        shell: pwsh
        env:
          MINISIGN_KEY: ${{ secrets.MINISIGN_KEY }}
        run: |
          if (-not $env:MINISIGN_KEY) { throw "MINISIGN_KEY secret is not set" }
          Invoke-WebRequest https://github.com/jedisct1/minisign/releases/download/0.12/minisign-0.12-win64.zip -OutFile minisign.zip
          $hash = (Get-FileHash minisign.zip -Algorithm SHA256).Hash
          if ($hash -ne "37B600344E20C19314B2E82813DB2BFDCC408B77B876F7727889DBD46D539479") { throw "minisign.zip checksum $hash" }
          Expand-Archive minisign.zip -DestinationPath minisign
          $key = Join-Path $env:RUNNER_TEMP "sigwin.key"
          $env:MINISIGN_KEY | Out-File -Encoding ascii $key
          Copy-Item target\release\sigwin.exe sigwin.exe
          # the app accepts only this exact trusted comment for this version
          .\minisign\minisign-win64\x86_64\minisign.exe -S -s $key -m sigwin.exe -t "sigwin $env:VERSION"
          $code = $LASTEXITCODE
          Remove-Item $key
          if ($code -ne 0) { throw "minisign failed" }

      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v$env:VERSION" --target "${{ github.sha }}" sigwin.exe sigwin.exe.minisig licenses.html --title "Sigwin $env:VERSION" --generate-notes
