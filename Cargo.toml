[package]
name = "sigwin"
version = "0.2.22"
edition = "2024"
license = "AGPL-3.0-only"
description = "A lightweight Signal-compatible desktop client (unofficial)"

[dependencies]
presage = { git = "https://github.com/whisperfish/presage", rev = "885f0647d1f8bddd44d7eaf6058481e115093c35" }
presage-store-sqlite = { git = "https://github.com/whisperfish/presage", rev = "885f0647d1f8bddd44d7eaf6058481e115093c35", features = ["cdsi"] }

slint = { version = "1.19.0", default-features = false, features = [
    "std",
    "compat-1-2",
    "backend-winit",
    "renderer-software",
    "software-renderer-systemfonts",
    "raw-window-handle-06",
    "unstable-winit-030",
] }
# patched (see [patch.crates-io]): text styles API `styled_text::sigwin_*`.
# image-decoders: `Image::load_from_data` plays animated stickers (PNG through our `image`)
i-slint-core = { version = "=1.19.0", default-features = false, features = ["image-decoders"] }
raw-window-handle = "0.6"

anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
directories = "6"
futures = "0.3"
sha2 = "0.11"
# streamed attachment encryption (backend/upload.rs); the versions libsignal-service uses
aes = "0.9"
cbc = "0.2"
hmac = "0.13"
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
mime_guess = "2"
qrcode = { version = "0.14", default-features = false }
rfd = { version = "0.15", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["sqlite", "runtime-tokio", "uuid"] }
tokio = { version = "1.48", features = ["rt", "time", "sync", "macros", "net"] }
getrandom = "0.3"
tracing = "0.1"
dhat = { version = "0.3.3", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = "1"
url = "2"
base64 = "0.22"
# pure-Rust sqlcipher crypto: no OpenSSL needed on Windows
libsqlite3-sys = { version = "0.36.0", features = ["bundled-sqlcipher-custom-crypto"] }
unicode-segmentation = "1"
sys-locale = "0.3.2" # the UI language when the user hasn't picked one; Slint's bundle uses it too
emojis = "0.9.1" # the reaction picker's emoji list
# streaming PNG encoder for pasted clipboard images (same version the image crate uses)
png = "0.18"
# Slint-generated UI: a separate crate so Rust-only edits don't recompile it
sigwin-ui = { path = "crates/ui" }
# decode/resample: a separate crate so it stays optimized in the `fast` profile
sigwin-thumb = { path = "crates/thumb" }
# encrypted attachment/thumbnail cache files: own crate for the same reason
sigwin-vault = { path = "crates/vault" }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream"] }
minisign-verify = "0.3.0"
# Signal's backup format, for the history the phone sends when linking. Not the latest tag: it
# must be the libsignal presage pins (Cargo.lock), whose key and id types it shares; bump them
# together. `test-util` is what makes its `proto` module public.
libsignal-message-backup = { git = "https://github.com/signalapp/libsignal", tag = "v0.99.0", features = ["test-util"] }
libsignal-account-keys = { git = "https://github.com/signalapp/libsignal", tag = "v0.99.0" }
protobuf = "3.7" # the version libsignal-message-backup's generated code uses

[workspace]
members = ["crates/thumb", "crates/vault", "crates/ui"]

[features]
# optional GPU renderers for comparison; pick at runtime with SLINT_BACKEND=winit-femtovg|winit-skia|winit-software
renderer-femtovg = ["slint/renderer-femtovg"]
renderer-skia = ["slint/renderer-skia"]
# heap profiling: where the Rust heap's peak was allocated, written to dhat-heap.json in the
# logs folder on exit (open it in DHAT's viewer). Build with `--profile prof` for the backtraces.
dhat-heap = ["dep:dhat"]

[build-dependencies]
rspolib = "0.1.2" # the .po parser slint-build uses for the same catalogs (`src/i18n.rs`)

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_UI_WindowsAndMessaging", "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Registry", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_UI_HiDpi", "Win32_UI_Controls", "Win32_System_LibraryLoader", "Win32_System_StationsAndDesktops", "Win32_System_SystemInformation", "Win32_System_Power"] }
# WinRT toasts (tag/group, history, click): same version Slint's deps already build
windows = { version = "0.62", features = ["Data_Xml_Dom", "Foundation", "UI_Notifications", "Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_UI_Shell"] }
self-replace = "1.5.1"

[target.'cfg(not(windows))'.dependencies]
notify-rust = "4"

# debug builds: line tables for our crate (readable backtraces), no debuginfo for
# dependencies. Full debuginfo made target/debug 16GB and slowed every link.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

# the crates every release rebuilds: one codegen unit runs their LLVM passes and ThinLTO on a
# single core and took most of a release build. 4 got nearly all of what 8 or 16 save in time,
# for less size. sigwin-thumb stays at 1: its pixel loops are the hot code.
[profile.release.package.sigwin]
codegen-units = 4

[profile.release.package.sigwin-ui]
codegen-units = 4

[patch.crates-io]
# glyph hinting and contrast in the software renderer: see vendor/i-slint-renderer-software, "sigwin patch"
i-slint-renderer-software = { path = "vendor/i-slint-renderer-software" }
# StyledText passes non-link mouse events through (clickable links over a selectable TextInput): see vendor/i-slint-core, "sigwin patch"
i-slint-core = { path = "vendor/i-slint-core" }
# color emoji (COLR layers) lost their bottom row and right column: see vendor/swash, "sigwin patch"
swash = { path = "vendor/swash" }
libsqlite3-sys = { version = "0.36.0", git = "https://github.com/whisperfish/rusqlite", rev = "2a42b3354c9194700d08aa070f70a131a470e7dc" }

# group sends go to the members concurrently instead of one round trip after another:
# see vendor/libsignal-service, "sigwin patch". Same rev as presage pins (Cargo.lock).
[patch."https://github.com/whisperfish/libsignal-service-rs"]
libsignal-service = { path = "vendor/libsignal-service" }

[dev-dependencies]
rspolib = "0.1.2" # the catalog check in `i18n` reads untranslated entries too
blake2 = "0.10"
ed25519-dalek = "3.0.0"
rand = "0.9" # not the latest: must match the version libsignal-protocol's traits use
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.sigwin-thumb]
opt-level = 3
[profile.dev.package.sigwin-vault]
opt-level = 3

# day-to-day builds: optimized like release (dependencies are compiled once and cached),
# but no LTO and incremental, so only this crate is rebuilt. `cargo build --profile fast`
[profile.fast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true

# our own code at opt-level 0: the Slint-generated UI (~6MB, crates/ui) took a .slint edit from ~9s
# to ~37s when optimized. Dependencies (renderer, image, sqlite) stay optimized. Use --release for
# memory/perf numbers.
[profile.fast.package.sigwin]
opt-level = 0

# heap profiling (`--features dhat-heap`): fast, keeping the symbols its backtraces need
[profile.prof]
inherits = "fast"
strip = false
debug = "line-tables-only"
[profile.fast.package.sigwin-ui]
opt-level = 0
