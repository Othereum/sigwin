# Third-party notices embedded in release builds (`cargo about`, see docs/release.md).
# Order is preference: for "A OR B" crates the first accepted license is listed.
# Slint is used under GPL-3.0 (combinable with Sigwin's AGPL-3.0, section 13).
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "BSL-1.0",
    "0BSD",
    "MIT-0",
    "CC0-1.0",
    "Unlicense",
    "NCSA",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
    "AGPL-3.0-only",
    "GPL-3.0-only",
]
targets = ["x86_64-pc-windows-msvc"]
ignore-build-dependencies = true
ignore-dev-dependencies = true

# part of the rusqlite repository, which is MIT; the crate itself declares no license
[sqlcipher-crypto-provider.clarify]
license = "MIT"
[[sqlcipher-crypto-provider.clarify.git]]
path = "LICENSE"
checksum = "c10c1f27337546471e5f7e4e97fdd398b35b9d4e126115dcd22de8d8e65abf6f"
